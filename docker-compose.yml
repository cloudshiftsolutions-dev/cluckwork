# Openship deploy stack (CloudShift HP Mini Elite). The reference stack in
# deploy/docker-compose.yml stays untouched; this one differs in three ways:
# - no env_file: Openship injects every value on the service,
# - migrations run in the app container before the server starts, instead of a
#   one-shot `migrate` service (Openship keeps every compose service running),
# - no traefik: the Openship edge and the VPS Caddy terminate TLS in front.
# EXACTLY ONE app instance: see the deploy invariant in deploy/docker-compose.yml.
services:
  app:
    build:
      context: .
      dockerfile: src/Cluckwork.Api/Dockerfile
    entrypoint: ["/bin/sh", "-c", "dotnet Cluckwork.Api.dll migrate && exec dotnet Cluckwork.Api.dll"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      HOST: "0.0.0.0"
      PORT: "8080"
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__AllowInsecureConnection: "true"
      AllowedHosts: ${CLUCKWORK_HOST}
      OAuth__Issuer: ${OAUTH_ISSUER}
      RateLimiting__TrustedProxies__0: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      RateLimiting__TrustedProxies__1: ${TRUSTED_GATEWAY_CIDR:-100.124.251.78/32}
      SharedState__Redis__ConnectionString: redis:6379
      Jwt__Issuer: cluckwork
      Jwt__Audience: cluckwork-api
      Jwt__PublicKeyPem: ${Jwt__PublicKeyPem}
      Jwt__PrivateKeyPem: ${Jwt__PrivateKeyPem}
      DataProtection__CertificatePem: ${DataProtection__CertificatePem}
      DataProtection__PrivateKeyPem: ${DataProtection__PrivateKeyPem}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "Cluckwork.Api.dll", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cluckwork-postgres-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cluckwork-postgres-pg18:
